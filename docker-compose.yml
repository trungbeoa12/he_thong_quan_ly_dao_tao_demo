services:
  mysql:
    image: mysql:8.4
    container_name: tms-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: training_management
      MYSQL_USER: tms
      MYSQL_PASSWORD: tms123
      MYSQL_ROOT_PASSWORD: root123
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "3306:3306"
    volumes:
      - tms_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  tms_mysql_data:

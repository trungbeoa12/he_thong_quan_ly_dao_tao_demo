<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head(${pageTitle})}"></head>
<body>
<div th:replace="~{layout/base :: shell(~{::content})}">
    <div th:fragment="content">
        <form class="form-panel" th:action="@{/departments}" th:object="${department}" method="post">
            <div class="form-header">
                <div>
                    <h2 class="h5 mb-1">Tạo phòng ban</h2>
                    <p class="text-muted mb-0">Master data nền cho Employee và reporting.</p>
                </div>
                <a class="btn btn-outline-secondary" th:href="@{/departments}">Back</a>
            </div>

            <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>

            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label" for="departmentCode">Mã phòng ban</label>
                    <input class="form-control" id="departmentCode" th:field="*{departmentCode}">
                    <div class="invalid-text" th:errors="*{departmentCode}"></div>
                </div>
                <div class="col-md-8">
                    <label class="form-label" for="departmentName">Tên phòng ban</label>
                    <input class="form-control" id="departmentName" th:field="*{departmentName}">
                    <div class="invalid-text" th:errors="*{departmentName}"></div>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="parentDepartmentId">Phòng ban cha</label>
                    <select class="form-select" id="parentDepartmentId" th:field="*{parentDepartmentId}">
                        <option value="">Không có</option>
                        <option th:each="parent : ${parentDepartments}" th:value="${parent.id}" th:text="${parent.departmentCode + ' - ' + parent.departmentName}"></option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="departmentType">Loại phòng ban</label>
                    <select class="form-select" id="departmentType" th:field="*{departmentType}">
                        <option th:each="type : ${departmentTypes}" th:value="${type}" th:text="${type.label}"></option>
                    </select>
                    <div class="invalid-text" th:errors="*{departmentType}"></div>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="status">Trạng thái</label>
                    <select class="form-select" id="status" th:field="*{status}">
                        <option th:each="statusValue : ${statuses}" th:value="${statusValue}" th:text="${statusValue.label}"></option>
                    </select>
                    <div class="invalid-text" th:errors="*{status}"></div>
                </div>
            </div>

            <div class="form-actions">
                <button class="btn btn-primary" type="submit">Save</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>

<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | TMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="login-page">
<main class="login-panel">
    <div class="mb-4">
        <div class="tms-brand text-dark mb-2">TMS</div>
        <h1 class="h4 mb-1">Sign in</h1>
        <p class="text-muted mb-0">Training Management System foundation demo</p>
    </div>
    <div class="alert alert-danger" th:if="${param.error}">Invalid username or password.</div>
    <div class="alert alert-success" th:if="${param.logout}">You have been logged out.</div>
    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label" for="username">Username</label>
            <input class="form-control" id="username" name="username" autocomplete="username" required>
        </div>
        <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary w-100" type="submit">Login</button>
    </form>
</main>
</body>
</html>

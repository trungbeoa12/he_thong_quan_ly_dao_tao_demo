<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head(${pageTitle})}"></head>
<body>
<div th:replace="~{layout/base :: shell(~{::content})}">
    <div th:fragment="content">
        <form class="form-panel" th:action="@{/instructors}" th:object="${instructor}" method="post">
            <div class="form-header">
                <div>
                    <h2 class="h5 mb-1">Tạo giảng viên</h2>
                    <p class="text-muted mb-0">Danh mục giảng viên nội bộ và bên ngoài cho các lớp đào tạo.</p>
                </div>
                <a class="btn btn-outline-secondary" th:href="@{/instructors}">Back</a>
            </div>

            <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>

            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label" for="instructorCode">Mã giảng viên</label>
                    <input class="form-control" id="instructorCode" th:field="*{instructorCode}">
                    <div class="invalid-text" th:errors="*{instructorCode}"></div>
                </div>
                <div class="col-md-8">
                    <label class="form-label" for="instructorName">Tên giảng viên</label>
                    <input class="form-control" id="instructorName" th:field="*{instructorName}">
                    <div class="invalid-text" th:errors="*{instructorName}"></div>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="instructorType">Loại giảng viên</label>
                    <select class="form-select" id="instructorType" th:field="*{instructorType}">
                        <option th:each="type : ${instructorTypes}" th:value="${type}" th:text="${type.label}"></option>
                    </select>
                    <div class="invalid-text" th:errors="*{instructorType}"></div>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="organization">Đơn vị</label>
                    <input class="form-control" id="organization" th:field="*{organization}">
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="expertise">Chuyên môn</label>
                    <input class="form-control" id="expertise" th:field="*{expertise}">
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="email">Email</label>
                    <input class="form-control" id="email" th:field="*{email}">
                    <div class="invalid-text" th:errors="*{email}"></div>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="phone">Số điện thoại</label>
                    <input class="form-control" id="phone" th:field="*{phone}">
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="hourlyRate">Hourly rate</label>
                    <input class="form-control" id="hourlyRate" type="number" min="0" step="1000" th:field="*{hourlyRate}">
                    <div class="invalid-text" th:errors="*{hourlyRate}"></div>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="status">Trạng thái</label>
                    <select class="form-select" id="status" th:field="*{status}">
                        <option th:each="statusValue : ${statuses}" th:value="${statusValue}" th:text="${statusValue.label}"></option>
                    </select>
                    <div class="invalid-text" th:errors="*{status}"></div>
                </div>
            </div>

            <div class="form-actions">
                <button class="btn btn-primary" type="submit">Save</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>

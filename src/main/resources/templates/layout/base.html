<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | TMS'">TMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<div th:fragment="shell(content)">
    <div class="tms-shell">
        <aside class="tms-sidebar">
            <div class="tms-brand">TMS</div>
            <nav class="nav flex-column">
                <a class="nav-link" th:href="@{/}">Dashboard</a>
                <a class="nav-link" th:href="@{/employees}">Employees</a>
                <a class="nav-link" th:href="@{/departments}">Departments</a>
                <a class="nav-link" th:href="@{/instructors}">Instructors</a>
                <a class="nav-link" th:href="@{/courses}">Courses</a>
                <a class="nav-link" href="#">Training Classes</a>
                <a class="nav-link" href="#">Schedule</a>
                <a class="nav-link" href="#">Registration</a>
                <a class="nav-link" href="#">Attendance</a>
                <a class="nav-link" href="#">Results</a>
                <a class="nav-link" href="#">Training Cost</a>
                <a class="nav-link" href="#">Reports</a>
                <a class="nav-link" th:href="@{/admin/users}">Users</a>
                <a class="nav-link" href="#">System Configuration</a>
            </nav>
        </aside>
        <main class="tms-main">
            <header class="tms-topbar">
                <div>
                    <div class="text-muted small">Training Management System</div>
                    <h1 class="h4 mb-0" th:text="${pageTitle}">Dashboard</h1>
                </div>
                <form th:action="@{/logout}" method="post" class="d-flex align-items-center gap-3">
                    <span class="text-muted small" sec:authentication="name">user</span>
                    <button class="btn btn-outline-secondary btn-sm" type="submit">Logout</button>
                </form>
            </header>
            <section class="tms-content" th:insert="${content}"></section>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

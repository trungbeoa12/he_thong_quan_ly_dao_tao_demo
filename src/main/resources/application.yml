spring:
  application:
    name: training-management-system
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/training_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${DB_USERNAME:tms}
    password: ${DB_PASSWORD:tms123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  thymeleaf:
    cache: false

server:
  port: ${PORT:8080}

logging:
  level:
    com.example.tms: INFO
